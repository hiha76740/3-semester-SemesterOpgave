name: BookingService CD

on:
  push:
    branches:
      - main
    paths:
      - "BookMyHome/src/BookingService/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "BookRight_BookingService"
  GITHUB_ACTOR: "ivang6464"
  DOCKER_IMAGE_CONTEXT: BookMyHome/src/BookingService

jobs:
  Build-and-Deploy-BookingService:
    name: Build and Deploy BookingService
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get Code
        uses: actions/checkout@v7


      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with: 
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB.TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with: 
          context: ${{ env.DOCKER_IMAGE_CONTEXT }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB.ACTOR }}/${{ env.IMAGE_NAME }}:latest
    