name: EmailService CI

on:
  push:
    branches:
      - main
    paths:
      - "BookMyHome/src/EmailService/**"
      - "BookMyHome/src/Shared/**"

permissions:
  contents: read

env:
  DOTNET_VERSION: "10.0.x"
  SOLUTION_PATH: "BookMyHome/BookMyHome.slnx"
  APPLICATION_PROJECT_PATH: "BookMyHome/tests/EmailService/EmailService.ApplicationLib.Tests/EmailService.ApplicationLib.Tests.csproj"

jobs:
  Build-And-Test-Application:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }}
          --configuration Release
          --no-restore

      - name: Test Application
        run: dotnet test --project ${{ env.APPLICATION_PROJECT_PATH }}
          --configuration Release
          --no-restore
          --no-build
          --verbosity normal
