name: Yarp Proxy CD

on:
  push:
    branches:
      - main
    paths:
      - "BookMyHome/src/Proxy/**"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: "bookmyhome-proxy"
  GITHUB_ACTOR: "hiha76740"
  DOCKER_IMAGE_CONTEXT: BookMyHome

jobs:
  Build-and-Deploy-AccomodationService:
    name: Build and Deploy Proxy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Get Code
        uses: actions/checkout@v7

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v4
        with: 
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@v7
        with: 
          context: ${{ env.DOCKER_IMAGE_CONTEXT }}
          file: ${{env.DOCKER_IMAGE_CONTEXT}}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.GITHUB_ACTOR }}/${{ env.IMAGE_NAME }}:latest
    
