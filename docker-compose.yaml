services:

  BookMyHome-Frontend:
    image: ghcr.io/hiha76740/bookmyhome-frontend:latest
    container_name: bookmyhome-frontend
    restart: unless-stopped
    ports:
        - 8090:80
        - 8091:443
        
    volumes:
        - ./certs:/etc/nginx/certs:ro
        
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:443/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

  BookMyHome-Proxy:
    image: ghcr.io/hiha76740/bookmyhome-proxy:latest
    container_name: bookmyhome-proxy
    restart: unless-stopped
    ports:
        - 8000:8080
        - 8010:8081
        
    environment:
        ASPNETCORE_URLS: "http://+:8080;https://+:8081"
        
        ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/bookmyhome.pfx"
        ASPNETCORE_Kestrel__Certificates__Default__Password: "DinDevelopmentKode123"

    volumes:
        - ${USERPROFILE}/.aspnet/https:/https:ro
        
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
  
 
 
  mssql-UserDB:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql-userdb
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=6!8GSPTuHGHsmFfwrH!
      - MSSQL_PID=Developer
    volumes:
      - mssql-userdb-data:/var/opt/mssql
    restart: unless-stopped
 
  BookMyHome-UserService1:
    depends_on:
      - mssql-UserDB
    image: ghcr.io/hiha76740/bookmyhome-userservice:latest
    container_name: bookmyhome-userservice1
    restart: unless-stopped
        
    environment:
        ASPNETCORE_URLS: "http://+:8080;https://+:8081"
        
        ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/bookmyhome.pfx"
        ASPNETCORE_Kestrel__Certificates__Default__Password: "DinDevelopmentKode123"

    volumes:
        - ${USERPROFILE}/.aspnet/https:/https:ro

    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
  
  BookMyHome-UserService1-dapr:
    image: daprio/daprd:1.18.0
    command:
      - "./daprd"
      - "--app-id"
      - "userservice"
      - "--app-port"
      - "8080"
      - "--app-protocol"
      - "http"
    depends_on:
      - BookMyHome-UserService1
    network_mode: "service:BookMyHome-UserService1"
    restart: unless-stopped  
    
  BookMyHome-UserService2:
    depends_on:
