# -------- Dapr Services --------    

  placement:
    image: daprio/placement:1.18.0
    command: ["./placement", "--port", "50006"]
    restart: unless-stopped

  scheduler:
    image: daprio/scheduler:1.18.0
    command: ["./scheduler", "--port", "50007", "--etcd-data-dir", "/data"]
    user: root
    volumes:
      - dapr-scheduler-data:/data
    restart: unless-stopped

# -------- watchtower --------    

  watchtower:
    image: nickfedor/watchtower
    container_name: bookmyhome-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WATCHTOWER_POLL_INTERVAL: 30
      WATCHTOWER_CLEANUP: "true"
    command: --label-enable
        

volumes:
    mssql-userdb-data:
    mssql-bookingdb-data:
    mssql-Accomodationdb-data:
    BookMyHome-Images:
    dapr-scheduler-data: