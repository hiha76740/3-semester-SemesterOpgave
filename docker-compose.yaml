services:

# -------- Frontend --------

  BookMyHome-Frontend:
    image: ghcr.io/hiha76740/bookmyhome-frontend:latest
    container_name: bookmyhome-frontend
    restart: unless-stopped
    ports:
        - 8090:80
        - 8091:443
        
    volumes:
        - ./certs:/etc/nginx/certs:ro
        
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:443/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s

# -------- Proxy --------

  BookMyHome-Proxy:
    image: ghcr.io/hiha76740/bookmyhome-proxy:latest
    container_name: bookmyhome-proxy
    restart: unless-stopped
    ports:
        - 8000:8080
        - 8010:8081
        
    environment:
        ASPNETCORE_URLS: "http://+:8080;https://+:8081"
        
        ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/bookmyhome.pfx"
        ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNETCORE_KESTREL__CERTIFICATES__DEFAULT__PASSWORD}"

    volumes:
        - ${USERPROFILE}/.aspnet/https:/https:ro
        
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
  
 # -------- User DB --------
 
  mssql-UserDB:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: mssql-userdb
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: "${USERDB_SA_PASSWORD}"
      MSSQL_PID: Developer
    volumes:
      - mssql-userdb-data:/var/opt/mssql
    restart: unless-stopped
    ports:
        - 9001:1433
 
 # -------- User Service 1 --------
 
  BookMyHome-UserService1:
    depends_on:
      - mssql-UserDB
    image: ghcr.io/hiha76740/bookmyhome-userservice:latest
    container_name: bookmyhome-userservice1
      
    restart: unless-stopped
        
    environment:
        ASPNETCORE_URLS: "http://+:8080;https://+:8081"
        ConnectionStrings__UserDB: "${USER_DB_CONNECTION_STRING:?Connection string mangler}"
        ASPNETCORE_Kestrel__Certificates__Default__Path: "/https/bookmyhome.pfx"
        ASPNETCORE_Kestrel__Certificates__Default__Password: "${ASPNETCORE_KESTREL__CERTIFICATES__DEFAULT__PASSWORD}"
        Jwt__Key: "${JWT_KEY}"
        Jwt__Issuer: "${JWT_ISSUER}"
        Jwt__Audience: "${JWT_AUDIENCE}"

    volumes:
        - ${USERPROFILE}/.aspnet/https:/https:ro

    labels:
      com.centurylinklabs.watchtower.enable: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
  
  BookMyHome-UserService1-dapr:
    image: daprio/daprd:1.18.0
    command:
      - "./daprd"
      - "--app-id"
      - "userservice"
      - "--app-port"
      - "8080"
      - "--app-protocol"
      - "http"
      - "--placement-host-address"
      - "placement:50006"
      - "--scheduler-host-address"
      - "scheduler:50007"
    depends_on:
      - BookMyHome-UserService1
      - placement
      - scheduler
    network_mode: "service:BookMyHome-UserService1"
    restart: unless-stopped  
    labels:
      com.centurylinklabs.watchtower.enable: "true"
 
# -------- User Service 2 -------- 

