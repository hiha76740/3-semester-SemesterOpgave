server {
    listen 80;
	listen 443 ssl;
    server_name _;

	ssl_certificate /etc/nginx/certs/frontend.crt;
	ssl_certificate_key /etc/nginx/certs/frontend.key;

    root /usr/share/nginx/html;
    index index.html;

    # Framework-filer skal findes på disken
    location /_framework/ {
        try_files $uri =404;
    }

    # Blazor håndterer selv sine sider og routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Sender booking-kald videre til YARP
    location /bookings-api/ {
        proxy_pass http://BookMyHome-Proxy:8080;
    }

    # Sender accomodation-kald videre til YARP
    location /accomodations-api/ {
        proxy_pass http://BookMyHome-Proxy:8080;
    }

    # Sender auth-kald videre til YARP
    location /auth-api/ {
        proxy_pass http://BookMyHome-Proxy:8080;
    }

    # Sender users-kald videre til YARP
    location /users-api/ {
        proxy_pass http://BookMyHome-Proxy:8080;
    }

    # Sender listings-kald videre til YARP
    location /listings-api/ {
        proxy_pass http://BookMyHome-Proxy:8080;
    }

    # Sender listings-kald videre til YARP
    location /facilities-api/ {
        proxy_pass http://BookMyHome-Proxy:8080;
    }
}
