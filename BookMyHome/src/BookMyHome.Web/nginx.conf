server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Framework-filer skal findes på disken
    location /_framework/ {
        try_files $uri =404;
    }

    # Blazor håndterer selv sine sider og routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}